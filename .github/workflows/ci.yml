name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Deterministic evaluation
        run: npm run evaluate

      - name: Verify legal references
        run: npm run verify:legal

      - name: Build
        run: npm run build

      - name: Validate QA scripts parse
        run: |
          node --check scripts/phase2-scan-smoke.mjs
          node --check scripts/smoke-test.mjs
          node --check scripts/phase1-browser-qa.mjs
          node --check scripts/phase2-browser-qa.mjs
          node --check scripts/evaluate.mjs
          node --check scripts/verify-legal-references.mjs
