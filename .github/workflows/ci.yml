name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      BYS_MODEL_ENABLED: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Coverage (critical modules)
        run: npm run test:coverage

      - name: Deterministic evaluation
        run: npm run evaluate

      - name: Verify legal references
        run: npm run verify:legal

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Production-build browser tests
        run: npm run test:e2e

      - name: Browser QA scripts
        run: npm run qa:smoke

      - name: Browser QA phase 1
        run: npm run qa:phase1

      - name: Browser QA phase 2
        run: npm run qa:phase2

      - name: Scan smoke test
        run: npm run smoke:scan

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Validate support scripts parse
        run: |
          node --check scripts/phase2-scan-smoke.mjs
          node --check scripts/run-scan-smoke.mjs
          node --check scripts/evaluate.mjs
          node --check scripts/ai-smoke-test.mjs
          node --check scripts/run-browser-qa.mjs
          node --check scripts/verify-legal-references.mjs
