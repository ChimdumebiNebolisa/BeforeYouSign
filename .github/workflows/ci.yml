name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Coverage (critical modules)
        run: npm run test:coverage

      - name: Deterministic evaluation
        run: npm run evaluate

      - name: Verify legal-reference metadata
        run: npm run verify:legal-metadata

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Production-build browser tests
        run: npm run test:e2e

      - name: Browser QA scripts
        run: npm run qa:smoke

      - name: Browser QA phase 1
        run: npm run qa:phase1

      - name: Browser QA phase 2
        run: npm run qa:phase2

      - name: Scan smoke test
        run: npm run smoke:scan

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Validate support scripts parse
        run: |
          node --check scripts/phase2-scan-smoke.mjs
          node --check scripts/smoke-test.mjs
          node --check scripts/phase1-browser-qa.mjs
          node --check scripts/phase2-browser-qa.mjs
          node --check scripts/run-scan-smoke.mjs
          node --check scripts/evaluate.mjs
          node --check scripts/run-browser-qa.mjs
          node --check scripts/verify-legal-metadata.mjs

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-test-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
